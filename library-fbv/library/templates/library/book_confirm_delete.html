{% extends 'base.html' %}

{% block title %}Delete "{{ book.title }}" - My Library{% endblock %}

{% block content %}
<h1>Delete "{{ book.title }}"?</h1>
<p class="text-danger">This action cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete this book</button>
    <a href="{% url 'library:book-detail' book.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
