{% load catalog_extras %}
{% if page_obj.has_other_pages %}
<nav class="pagination">
    {% if page_obj.has_previous %}<a href="?{% qs_replace page=page_obj.previous_page_number %}">&laquo; Previous</a>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?{% qs_replace page=page_obj.next_page_number %}">Next &raquo;</a>{% endif %}
</nav>
{% endif %}
