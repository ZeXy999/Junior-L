{% extends 'catalog/base.html' %}

{% block title %}Log in &middot; {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="narrow">
    <h1>Log in</h1>
    <form method="post" class="form">{% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Log in</button>
    </form>
    <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</div>
{% endblock %}
